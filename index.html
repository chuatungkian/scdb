<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#242521">
<title>Office Room · 3D Walkthrough</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#262723;color:#f5f3ed}
*{box-sizing:border-box}
body{margin:0}
button,select{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid #c9dbb9;outline-offset:3px}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 24px;border-bottom:1px solid #45463f;background:#252620;z-index:2}
h1{font-size:20px;line-height:1.2;margin:0;font-weight:620;letter-spacing:-.035em}
.actions{display:flex;align-items:center;gap:8px}
select,.action{border:1px solid #55564c;border-radius:7px;background:#363730;color:#f1efe9;padding:8px 12px;font-size:13px;min-height:38px}
select{max-width:150px}
.action:hover{background:#484a40}
.stage{position:relative;min-height:0;overflow:hidden;background:#65645c}
canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none;outline-offset:-4px!important}
canvas:active{cursor:grabbing}
.hint,.viewcaption,.error{position:absolute;background:#262922ee;color:#fff;padding:9px 13px;border-radius:7px;font-size:12px;box-shadow:0 2px 12px #0002;pointer-events:none}
.hint{left:16px;bottom:max(16px, env(safe-area-inset-bottom))}
.viewcaption{right:16px;top:16px;max-width:calc(100% - 32px)}
.error{top:45%;left:50%;transform:translateX(-50%);text-align:center;line-height:1.5;width:min(88%,380px);font-size:15px}
.joystick{display:none;position:absolute;left:16px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 44px);width:116px;height:116px;border-radius:50%;border:1px solid #ffffff70;background:#242721b8;touch-action:none;user-select:none;cursor:grab}
.joystick[data-active]{background:#242721dc;cursor:grabbing}
.joystick::before,.joystick-knob{position:absolute;top:50%;left:50%;border-radius:50%;pointer-events:none}
.joystick::before{content:"";width:82px;height:82px;border:1px solid #ffffff36;transform:translate(-50%,-50%)}
.joystick-knob{width:44px;height:44px;border:1px solid #ffffffa0;background:#aeb6a5;box-shadow:0 2px 6px #0006;transform:translate(-50%,-50%) translate(var(--stick-x,0px),var(--stick-y,0px))}
.equipment{position:absolute;top:12px;right:14px;z-index:1;width:max-content;max-width:calc(100% - 28px)}
.equipment summary{width:max-content;margin-left:auto;cursor:pointer;list-style:none;background:#262922f5;color:#fff;border:1px solid #ffffff65;border-radius:7px;padding:9px 12px;font-size:13px}
.equipment summary::-webkit-details-marker{display:none}
.equipment summary::after{content:' ▾'}
.equipment[open] summary::after{content:' ▴'}
.equipment-sheet{width:min(286px,calc(100vw - 28px));max-height:min(62dvh,490px);overflow:auto;overscroll-behavior:contain;margin-top:6px;border:1px solid #505349;border-radius:8px;background:#252820;color:#f2f2ee;box-shadow:0 6px 22px #0005;font-size:13px}
.equipment fieldset{margin:6px 12px 10px;padding:0 0 3px;border:0;border-bottom:1px solid #494d41}
.equipment legend{padding:0 0 3px;color:#c8d5be;font-size:12px;font-weight:650}
.equipment label{display:flex;align-items:center;gap:8px;min-height:31px;cursor:pointer}
.equipment input{accent-color:#abc099;width:17px;height:17px;margin:0}
.equipment-actions{position:sticky;top:0;display:flex;gap:6px;padding:9px 12px;background:#252820}
.equipment-actions button{padding:4px 8px;color:inherit;background:#374035;border:1px solid #606c5c;border-radius:5px;min-height:29px}
.viewcaption{right:auto;left:16px}
.chair-controls{position:absolute;right:14px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 44px);display:flex;flex-direction:column;gap:4px;align-items:center;background:#262922ed;border:1px solid #ffffff48;border-radius:8px;color:#fff;padding:6px}
.chair-controls span{font-size:11px}
.chair-controls button{width:42px;height:42px;border-radius:6px;border:1px solid #ffffff53;background:#41483e;color:#fff;font-size:22px;line-height:1}
.chair-controls button:hover,.chair-controls button:active{background:#596858}
.chair-controls #chair-seat{width:100%;height:35px;font-size:13px;padding:0 7px}
#interaction-note{left:50%;right:auto;top:60px;transform:translateX(-50%);width:max-content;max-width:92%;z-index:2}
.interact-menu{left:14px;right:auto;z-index:3}
.interact-menu summary{margin:0}
.interact-sheet{background:#252820;color:#f2f2ee;border:1px solid #505349;border-radius:8px;padding:9px;display:grid;gap:7px;grid-template-columns:repeat(2,minmax(0,1fr));width:min(296px,calc(100vw - 28px));max-height:60dvh;overflow:auto;margin-top:6px;box-shadow:0 6px 22px #0005}
.interact-sheet button{min-height:43px;background:#374035;border:1px solid #606c5c;border-radius:6px;color:inherit;font-size:13px;padding:5px 7px}
.interact-sheet button:active{background:#5d7058}
.interact-sheet button:disabled{opacity:.42}
@media(max-width:540px){#interaction-note{left:50%;top:60px}}
.touchhint{display:none}
[hidden]{display:none!important}
@media(pointer:coarse){.joystick{display:block}.touchhint{display:inline}.keyhint{display:none}}
@media(max-width:540px){header{padding:10px 12px;gap:8px}h1{font-size:17px}.actions{gap:5px}.action,select{padding:7px 8px}.hint{left:10px;bottom:10px}.viewcaption{top:10px;left:10px;right:auto}}
</style>
</head>
<body>
<div class="app">
<header><h1>Office Room</h1><div class="actions">
<select id="view" aria-label="Room view">
<option value="entry">Doorway</option><option value="desk">Interior</option>
<option value="workstation">Workstation</option><option value="hall">Hallway</option><option value="plan">Floor plan</option><option value="ceiling">Ceiling plan</option>
</select><button class="action" id="door" type="button">Close door</button></div></header>
<main class="stage">
<canvas tabindex="0" aria-label="3D office. Drag or use arrow keys to look. Use W A S D to walk."></canvas>
<div class="hint" id="hint">
  <span id="walking-hint"><span class="keyhint">Drag to look · WASD to walk · Tap or drag chair</span><span class="touchhint">Joystick to walk · Tap or drag chair</span></span>
  <span id="seated-hint" hidden>Drag to swivel · Tap desk items or use Interact</span>
</div>
<output class="viewcaption" id="interaction-note" aria-live="polite" hidden></output>
<div class="viewcaption" id="caption" hidden></div>
<div class="joystick" id="joystick" role="group" aria-label="Movement joystick">
  <span class="joystick-knob" aria-hidden="true"></span>
</div>
<details class="equipment" id="equipment"><summary>Desk items</summary><div class="equipment-sheet">
<div class="equipment-actions"><button id="place-all" type="button">Place all</button><button id="clear-desk" type="button">Clear desk</button></div>
<fieldset><legend>Position 1</legend>
<label><input type="checkbox" data-equipment="monitor1" checked> 31″ landscape monitor</label>
<label><input type="checkbox" data-equipment="keyboard1" checked> Keyboard</label>
<label><input type="checkbox" data-equipment="mouse1" checked> Mouse</label>
</fieldset>
<fieldset><legend>Position 2</legend>
<label><input type="checkbox" data-equipment="monitor2" checked> 27″ portrait monitor</label>
</fieldset>
<fieldset><legend>Position 3</legend>
<label><input type="checkbox" data-equipment="laptopLeft" checked> Left laptop and stand</label>
<label><input type="checkbox" data-equipment="laptopRight" checked> Right laptop and stand</label>
<label><input type="checkbox" data-equipment="monitorAbove" checked> 27″ monitor above left laptop</label>
</fieldset>
<fieldset><legend>Position 4</legend>
<label><input type="checkbox" data-equipment="monitor4" checked> 27″ landscape monitor</label>
<label><input type="checkbox" data-equipment="keyboard4" checked> Keyboard</label>
<label><input type="checkbox" data-equipment="mouse4" checked> Mouse</label>
</fieldset>
<fieldset><legend>Mobile devices</legend>
<label><input type="checkbox" data-equipment="ipad" checked> iPad</label>
<label><input type="checkbox" data-equipment="phone" checked> Phone and stand</label>
</fieldset>
<fieldset><legend>Water station</legend>
<label><input type="checkbox" data-equipment="dispenser" checked> Instant hot water dispenser</label>
<label><input type="checkbox" data-equipment="waterJug" checked> Clear water jug</label>
<label><input type="checkbox" data-equipment="coolingPlate" checked> Cooling plate + 300 mL titanium cup</label>
<label><input type="checkbox" data-equipment="warmerPlate" checked> Warming plate + 300 mL titanium cup</label>
</fieldset>
</div></details>
<details class="equipment interact-menu" id="interact-menu"><summary>Interact</summary>
  <div class="interact-sheet">
    <button type="button" id="interact-seat">Sit down</button>
    <button type="button" data-room-action="keyboard1">Main keyboard</button>
    <button type="button" data-room-action="mouse1">Main mouse</button>
    <button type="button" data-room-action="keyboard4">Return keyboard</button>
    <button type="button" data-room-action="mouse4">Return mouse</button>
    <button type="button" data-room-action="coolingPlate">Sip cool water</button>
    <button type="button" data-room-action="warmerPlate">Sip warm water</button>
    <button type="button" data-cabinet-door="3" aria-pressed="false">Cabinet door 1</button>
    <button type="button" data-cabinet-door="2" aria-pressed="false">Cabinet door 2</button>
    <button type="button" data-cabinet-door="1" aria-pressed="false">Cabinet door 3</button>
    <button type="button" data-cabinet-door="0" aria-pressed="false">Cabinet door 4</button>
  </div>
</details>
<div class="chair-controls" id="chair-controls" role="group" aria-label="Rotate chair">
  <button type="button" id="chair-seat" aria-pressed="false">Sit down</button>
  <span aria-hidden="true">Rotate chair</span>
  <div>
    <button type="button" id="chair-left" aria-label="Rotate chair left" title="Rotate chair left">↺</button>
    <button type="button" id="chair-right" aria-label="Rotate chair right" title="Rotate chair right">↻</button>
  </div>
</div>
<p class="error" id="error" hidden></p>
</main></div>

function spin(profile,color,material=0,sides=32,offset=[0,0,0]){
  const [dx,dy,dz]=offset;
  function point([radius,height],index){
    const angle=index*2*Math.PI/sides;
    return [dx+radius*Math.cos(angle),dy+height,dz+radius*Math.sin(angle)];
  }
  for(let row=0;row<profile.length-1;row++){
    const lower=profile[row],upper=profile[row+1];
    for(let i=0;i<sides;i++){
      const a=point(lower,i),b=point(lower,i+1),c=point(upper,i+1),d=point(upper,i);
      if(lower[0]===0)tri(a,d,c,color,material);
      else if(upper[0]===0)tri(a,d,b,color,material);
      else quad(a,d,c,b,color,material);
    }
  }
}
function sphereAt(x,y,z,radius,color,material,sides=24,rings=12){
  const profile=[];
  for(let i=0;i<=rings;i++){
    const angle=(i/rings-.5)*Math.PI;
    profile.push([i===0||i===rings?0:Math.cos(angle)*radius,Math.sin(angle)*radius]);
  }
  spin(profile,color,material,sides,[x,y,z]);
}

    const [localX,localZ]=cabinetLocal(eye[0],eye[2],i);
    const [endX,endZ]=cabinetLocal(eye[0]+ray[0],eye[2]+ray[2],i);
    const hit=rayBox([endX-localX,ray[1],endZ-localZ],
      [x-.04,.102,z-.01],[x+.025,1.51,z+cabinetDoorWidth-.002],[localX,eye[1],localZ]);
    if(hit<nearest){nearest=hit;picked=i;}
  }
  return picked;
}
function toggleCabinet(i){
  if(!presets[mode])return;
  audioContext();
  const open=cabinetGoals[i]===0;
  const goal=open?cabinetSwing:0;
  // Use the same floating-point target for interpolation and completion.
  cabinetGoals[i]=goal;
  if(reduced&&!cabinetDoorHits(eye[0],eye[2],.115,i,cabinetGoals[i])){
    cabinetAngles[i]=cabinetGoals[i];
    if(!open)playRoomSound('cabinet');
  }
  for(const button of cabinetButtons){
    if(Number(button.dataset.cabinetDoor)===i)button.setAttribute('aria-pressed',String(open));
  }
  dirty=true;
}
function updateCabinets(dt){
  for(let i=0;i<cabinetAngles.length;i++){
    const remaining=cabinetGoals[i]-cabinetAngles[i];
    if(remaining===0)continue;
    const next=Math.abs(remaining)<=2.65*dt?cabinetGoals[i]:
      cabinetAngles[i]+Math.sign(remaining)*2.65*dt;
    if(cabinetDoorHits(eye[0],eye[2],.115,i,next))continue;
    if(cabinetDoorHits(chairPosition.x,chairPosition.z,chairRadius,i,next))continue;
    cabinetAngles[i]=next;
    if(next===0)playRoomSound('cabinet');
  }
}

function camera(position,look,up,proj){
  const z=unit(sub(position,look)),x=unit(cross(up,z)),y=cross(z,x);
  const basis=[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,position),-dot(y,position),-dot(z,position),1];
  const matrix=new Float32Array(16);
  for(let row=0;row<4;row++)for(let col=0;col<4;col++)for(let k=0;k<4;k++) matrix[col*4+row]+=proj[k*4+row]*basis[col*4+k];
  return matrix;
}
function batch(name){const {vao,count}=profile[name];gl.bindVertexArray(vao);gl.drawArrays(gl.TRIANGLES,0,count);}
// A wax blob rises when warm and falls as it cools. Stokes-like drag
// damps its velocity, and the tapered vessel limits the lateral drift.
const lavaOffsets=new Float32Array(27);
function updateLava(dt,seconds){
  for(let i=0;i<lavaBlobs.length;i++){
    const b=lavaBlobs[i],r=b.radius;
    const bottom=.060+1.2*r,top=.211-1.15*r;
    const p=(b.y-bottom)/(top-bottom);
    const heat=Math.max(0,1-p*3.1),cool=Math.max(0,(p-.68)/.32);
    b.temp+=dt*(1.8*heat*(1-b.temp)-1.4*cool*b.temp);
    b.velocity+=(.22*(b.temp-.50)-2.8*b.velocity)*dt;
    b.y+=b.velocity*dt;
    if(b.y<bottom||b.y>top){
      b.y=Math.max(bottom,Math.min(top,b.y));
      b.velocity*=-.16;
    }
    const clearance=Math.max(0,.039-(b.y-.067)*.108-r-.002);
    const phase=seconds*.85+i*2.399;
    const x=clearance*.72*Math.sin(phase);
    const z=clearance*.65*Math.cos(phase*.74+i);
    lavaOffsets.set([x-b.home[0],b.y-b.home[1],z-b.home[2]],i*3);
  }
}

let prior=performance.now(),lastLavaPaint=prior,frames=0;
function frame(now){
  const dt=Math.min((now-prior)/1000,.045);prior=now;
  const animated=doorAngle!==doorGoal;
  const lavaActive=!reduced&&!!presets[mode];
  if(lavaActive)updateLava(dt,now/1000);
  const cabinetMoving=cabinetAngles.some((angle,i)=>angle!==cabinetGoals[i]);
  const changed=keys.size>0||animated||cabinetMoving||sip||(noteUntil&&now>=noteUntil)||stick.right||stick.forward||
    (lavaActive&&now-lastLavaPaint>=32);
  const scale=Math.min(devicePixelRatio,1.6);
  const w=Math.max(1,Math.round(canvas.clientWidth*scale)),h=Math.max(1,Math.round(canvas.clientHeight*scale));
  const resized=canvas.width!==w||canvas.height!==h;
  if(resized){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}
  if(changed||resized||lastMode!==mode||frames===0||dirty){
    if(keys.has('arrowleft'))turnView(-1.6*dt);
    if(keys.has('arrowright'))turnView(1.6*dt);
    if( keys.has('arrowup'))pitch=Math.min(1.48,pitch+1.2*dt);
    if( keys.has('arrowdown'))pitch=Math.max(-1.48,pitch-1.2*dt);
    const forward=Number(keys.has('w'))-Number(keys.has('s'))+stick.forward;
    const right=Number(keys.has('d'))-Number(keys.has('a'))+stick.right;
    if(seated){
      if(right)turnView(right*1.6*dt);
      if(forward)pitch=Math.max(-1.48,Math.min(1.48,pitch+forward*.8*dt));
    }else if(forward||right){
      const speed=1.18*dt/Math.max(1,Math.hypot(forward,right));
      const dx=(Math.sin(yaw)*forward+Math.cos(yaw)*right)*speed;
      const dz=(-Math.cos(yaw)*forward+Math.sin(yaw)*right)*speed;
      const [priorX,,priorZ]=eye;
      if(canStand(eye[0]+dx,eye[2]))eye[0]+=dx;
      if(canStand(eye[0],eye[2]+dz))eye[2]+=dz;
      walkSound(Math.hypot(eye[0]-priorX,eye[2]-priorZ),now);
    }
    if(animated){
      const remaining=doorGoal-doorAngle;
      doorAngle=Math.abs(remaining)<=2.8*dt?doorGoal:doorAngle+Math.sign(remaining)*2.8*dt;
      if(doorAngle===0)playRoomSound('door');
    }
    if(cabinetMoving)updateCabinets(dt);
    const aspect=w/h, orthographic=!presets[mode];
    let matrix,position=eye;
    if(orthographic){
      const roof=mode==='ceiling';
      position=[0,roof?4.4:3.5,roof?0:.43];
      const sy=Math.max(roof?3.98:5.60,3.73/aspect),sx=sy*aspect;
      matrix=camera(position,[position[0],0,position[2]],[0,0,-1],[2/sx,0,0,0,0,2/sy,0,0,0,0,-2/10,0,0,0,-1,1]);
    }else{
      const c=Math.cos(pitch),zoom=perspectiveZoom(aspect);
      const far=23,near=.041;
      matrix=camera(eye,[eye[0]+Math.sin(yaw)*c,eye[1]+Math.sin(pitch),eye[2]-Math.cos(yaw)*c],[0,1,0],
        [zoom/aspect,0,0,0,0,zoom,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]);
    }
    gl.uniformMatrix4fv(uniforms.projection,false,matrix);
    gl.uniform3fv(uniforms.eye,position);
    gl.uniform3fv(uniforms['lavaOffsets[0]'],lavaOffsets);
    updateSip(now);
    gl.uniform4fv(uniforms['sipOffsets[0]'],sipOffsets);
    gl.uniform1fv(uniforms['cabinetAngles[0]'],cabinetAngles);
    lastLavaPaint=now;
    gl.uniform1i(uniforms.plan,orthographic);
    gl.uniform1f(uniforms.doorAngle,mode==='plan'?1.45:doorAngle);
    gl.uniform2f(uniforms.chairShift,chairPosition.x-chairHome.x,chairPosition.z-chairHome.z);
    gl.uniform1f(uniforms.chairRotation,chairDegrees*Math.PI/180);
    gl.clearColor(...(orthographic?[.84,.84,.84,1]:[.40,.39,.36,1]));
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    if(mode==='ceiling'){
      // Viewed from below, so the tile faces and fixtures remain visible.
      const sy=Math.max(3.98,3.73/aspect),sx=sy*aspect;
      gl.uniformMatrix4fv(uniforms.projection,false,camera([0,.10,0],[0,3.1,0],[0,0,-1],[2/sx,0,0,0,0,2/sy,0,0,0,0,-2/10,0,0,0,-1,1]));
      batch('ceiling');
    }else{
      batch('shell');batch('front');batch('apron');batch('furniture');batch('chair');batch('door');
      for(const name of visibleEquipment)batch(name);
      if(!orthographic){batch('ceiling');batch('hall');}
      gl.depthMask(false);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
      batch('decorGlass');
      if(visibleEquipment.has('waterJug'))batch('jugGlass');
      batch('glass');if(!orthographic)batch('lettering');
      gl.disable(gl.BLEND);gl.depthMask(true);
    }
    lastMode=mode;dirty=false;frames++;
    canvas.dataset.ready='true';
  }
  requestAnimationFrame(frame);
}
let lastMode,dirty=true;
seatButton.addEventListener('click',toggleSeat);
for(const button of cabinetButtons)button.addEventListener('click',()=>toggleCabinet(Number(button.dataset.cabinetDoor)));
interactSeat.addEventListener('click',()=>{
  interactMenu.open=false;
  toggleSeat();
});
for(const button of deskActionButtons)button.addEventListener('click',()=>{
  const item=button.dataset.roomAction;
  if(item.endsWith('Plate')){
    interactMenu.open=false;
    if(!seated&&eye[2]>=front)setView('workstation');
  }
  useDeskItem(item);
});
syncDeskActions();
for(const [id,step] of [['#chair-left',-15],['#chair-right',15]]){
  document.querySelector(id).addEventListener('click',()=>{
    if(seated)turnView(step*Math.PI/180);
    else chairDegrees=(chairDegrees+step+360)%360;
    dirty=true;
  });
}
function updateEquipment(){
  visibleEquipment.clear();
  for(const input of equipmentInputs){
    if(input.checked)visibleEquipment.add(input.dataset.equipment);
  }
  syncDeskActions();
  try {localStorage.setItem('office-room-desk-items',JSON.stringify({selected:[...visibleEquipment],mobileDevices:true}));} catch {}
  dirty=true;
}
for(const input of equipmentInputs)input.addEventListener('change',updateEquipment);
for(const [button,checked] of [['#place-all',true],['#clear-desk',false]]){
  document.querySelector(button).addEventListener('click',()=>{
    for(const input of equipmentInputs)input.checked=checked;
    updateEquipment();
  });
}
view.addEventListener('change',()=>{dirty=true;});
doorButton.addEventListener('click',()=>{dirty=true;});
canvas.addEventListener('pointermove',()=>{dirty=true;});
canvas.addEventListener('pointerup',()=>{dirty=true;});
window.roomReview={triangleCount:Object.values(profile).reduce((sum,item)=>sum+item.count/3,0),position:()=>[...eye],door:()=>doorAngle,chair:()=>({...chairPosition})};
requestAnimationFrame(frame);
}
run().catch(problem=>{
  console.error(problem);
  error.textContent=problem instanceof Error&&problem.message.startsWith('This walkthrough')?problem.message:'The room could not load. Try reopening the file in a WebGL-capable browser.';
  error.hidden=false;
});
</script>
</body>
